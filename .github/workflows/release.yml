name: Build and release PhotoSync
run-name: Release ${{ inputs.tag || github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      component:
        description: all builds everything; android retries APK; android-tests verifies an existing draft APK and reruns tests
        type: choice
        default: all
        options: [all, android, android-tests]
      verify_only:
        description: Build and test Android without creating a release or pushing images
        type: boolean
        default: false
      tag:
        description: Release tag (e.g. v2026.10.30.1)
        required: true
        type: string
      build_number:
        description: Android date build number (10 digits; must increase)
        required: true
        type: string
  push:
    tags: ['v20*']
permissions:
  contents: read
concurrency:
  group: photosync-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build_number: ${{ steps.release.outputs.build_number }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version and prepare draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          BUILD_INPUT: ${{ inputs.build_number }}
          COMPONENT: ${{ inputs.component || 'all' }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v(20[0-9]{2})\.([0-9]{2})\.([0-9]{2})\.([0-9]{1,2})$ ]] || { echo 'Invalid release tag'; exit 1; }
          number="${BUILD_INPUT:-${BASH_REMATCH[1]}${BASH_REMATCH[2]}${BASH_REMATCH[3]}$(printf '%02d' "$((10#${BASH_REMATCH[4]}))") }"
          number="${number// /}"
          [[ "$number" =~ ^20[0-9]{8}$ ]] && ((10#$number + 2000 < 2147483647)) || { echo 'Invalid Android build number'; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_number=$number" >> "$GITHUB_OUTPUT"
          source_sha="$GITHUB_SHA"
          if [[ "$VERIFY_ONLY" == true ]]; then
            echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$COMPONENT" == android* ]]; then
            gh release view "$tag" --json isDraft,targetCommitish > /tmp/release-state.json
            jq -e '.isDraft == true' /tmp/release-state.json >/dev/null
            source_sha=$(jq -r .targetCommitish /tmp/release-state.json)
            [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
            mkdir /tmp/image-check
            gh release download "$tag" --pattern '*-image.json' --dir /tmp/image-check
            jq -se --arg sha "$source_sha" 'length==2 and all(.[]; .commit==$sha and (.digest | contains("@sha256:")))' /tmp/image-check/server-image.json /tmp/image-check/machine-learning-image.json >/dev/null
          elif gh release view "$tag" --json isDraft > /tmp/release-state.json 2>/dev/null; then
            jq -e '.isDraft == true' /tmp/release-state.json >/dev/null || { echo 'Published releases cannot be overwritten'; exit 1; }
            gh release edit "$tag" --target "$source_sha"
          else
            gh release create "$tag" --target "$source_sha" --draft --title "PhotoSync $tag" --notes 'Build in progress. The release is published only after all three components pass.'
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
  android:
    name: Android ${{ matrix.stage }}
    strategy:
      fail-fast: false
      matrix:
        stage: [apk, tests]
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_DISABLE_TOOLS: node,pnpm,terragrunt,opentofu,npm:oazapfts,github:extism/cli,github:webassembly/binaryen,github:extism/js-pdk,github:jellyfin/jellyfin-ffmpeg
      ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      GRADLE_OPTS: -Dorg.gradle.workers.max=4 -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx6144m -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Record runner resources
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h /
      - name: Free disk space while retaining required Android SDK components
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images"
          # Retain installed versions the app/plugins need; remove only unused versions.
          sudo env ANDROID_HOME="$ANDROID_HOME" python3 - <<'PYSDK'
          import os, pathlib, shutil
          sdk=pathlib.Path(os.environ['ANDROID_HOME'])
          keep={'ndk': {'28.2.13676358'}, 'platforms': {'android-33','android-34','android-35','android-36'}, 'build-tools': {'35.0.0','36.0.0'}}
          for family, versions in keep.items():
              if (sdk/family).exists():
                  for entry in (sdk/family).iterdir():
                      if entry.is_dir() and entry.name not in versions:
                          shutil.rmtree(entry)
          PYSDK
          docker image prune -af
          df -h /
      - name: Restore toolchain and dependency cache
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/share/mise/installs
            ~/.pub-cache
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: android-deps-v1-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock', 'mobile/android/gradle/libs.versions.toml') }}
      - name: Restore Gradle compilation cache
        id: compilation
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/8.14/transforms
          key: android-compile-v2-${{ runner.os }}-${{ matrix.stage }}-${{ hashFiles('mobile/android/gradle/libs.versions.toml', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/gradle.properties', 'mobile/android/app/build.gradle', 'mobile/pubspec.lock') }}-${{ needs.prepare.outputs.source_sha }}
          restore-keys: |
            android-compile-v2-${{ runner.os }}-${{ matrix.stage }}-${{ hashFiles('mobile/android/gradle/libs.versions.toml', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/gradle.properties', 'mobile/android/app/build.gradle', 'mobile/pubspec.lock') }}-
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: false
          cache: false
      - name: Install locked Flutter and Java
        run: mise install aqua:flutter/flutter@3.44.1 java@21.0.2
      - name: Prepare Android SDK and signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$ALIAS" && test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > mobile/android/key.jks
          chmod 600 mobile/android/key.jks
          python3 - <<'PY'
          import os, pathlib, re
          p=pathlib.Path('mobile/pubspec.yaml')
          p.write_text(re.sub(r'^version: .*$', 'version: 3.0.3+'+os.environ['BUILD_NUMBER'], p.read_text(), flags=re.M))
          PY
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Generate and build arm64 release
        if: matrix.stage == 'apk' && inputs.component != 'android-tests'
        run: ./scripts/build-android.sh
      - name: Recover existing draft APK
        if: matrix.stage == 'apk' && inputs.component == 'android-tests'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/releases
          gh release download "$TAG" --pattern 'photosync-android-arm64-v8a-latest.apk' --pattern SHA256SUMS --dir artifacts/releases
          (cd artifacts/releases && sha256sum --check SHA256SUMS)
      - name: Generate test inputs
        if: matrix.stage == 'tests'
        working-directory: mobile
        run: |
          mise exec -- flutter pub get
          mise run i18n:loader
          mise run i18n:keys
          for input in pigeon/*.dart; do mise exec -- dart run pigeon --input "$input"; done
          mise exec -- dart run build_runner build --delete-conflicting-outputs
      - name: Verify release APK and upload to draft
        if: matrix.stage == 'apk'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: |
          set -euo pipefail
          apk=artifacts/releases/photosync-android-arm64-v8a-latest.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apk-signature.txt
          grep -q "certificate SHA-256 digest: a2397706509fc8a74c08489b9735f0a1fa9aa0a09fb2a49a72345f29a8b18b39" /tmp/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/apk-badging.txt
          grep -q "name='app.alextran.immich'" /tmp/apk-badging.txt
          grep -q "versionName='$BUILD_NUMBER'" /tmp/apk-badging.txt
          grep -q "versionCode='$((10#$BUILD_NUMBER + 2000))'" /tmp/apk-badging.txt
          grep -qx "native-code: 'arm64-v8a'" /tmp/apk-badging.txt
          (cd artifacts/releases && sha256sum photosync-android-arm64-v8a-latest.apk > SHA256SUMS)
          if [[ "$VERIFY_ONLY" != true ]]; then
            gh release upload "$TAG" "$apk" artifacts/releases/SHA256SUMS --clobber
          fi
      - name: Save dependency cache before tests
        if: matrix.stage == 'apk' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/share/mise/installs
            ~/.pub-cache
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Test Flutter and Android native code
        if: matrix.stage == 'tests'
        working-directory: mobile
        run: |
          # Flutter tests register dev-only integration_test; regenerate production
          # registration and run release native tests before Flutter tests.
          mise exec -- flutter build apk --release --target-platform android-arm64 --split-per-abi --config-only --no-pub
          cd android
          mise exec -- ./gradlew --stop
          mise exec -- ./gradlew :app:testReleaseUnitTest -x :app:compileFlutterBuildRelease --max-workers=4 --no-daemon
          cd ..
          mise exec -- flutter test --concurrency=4 --reporter=expanded
      - name: Save Gradle compilation cache
        if: success() && steps.compilation.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/8.14/transforms
          key: ${{ steps.compilation.outputs.cache-primary-key }}
      - name: Remove private signing material
        if: always()
        run: rm -f mobile/android/key.jks mobile/android/key.properties
  images:
    if: inputs.verify_only != true && inputs.component != 'android' && inputs.component != 'android-tests'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        component: [server, machine-learning]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Free unused hosted runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker image prune -af
      - name: Build server production image and run unit tests
        if: matrix.component == 'server'
        run: |
          set -euo pipefail
          docker build --file server/Dockerfile --target server --tag photosync-ci-tests:local .
          docker run --rm --workdir /usr/src/app/server photosync-ci-tests:local node_modules/.bin/vitest --config test/vitest.config.mjs --run --maxWorkers=2
          docker run --rm --workdir /usr/src/app/server photosync-ci-tests:local node_modules/.bin/tsc --noEmit
          # Prebuild memory-intensive stages in sequence on the standard runner.
          docker build --file server/Dockerfile --target web --tag photosync-ci-web:local .
          docker build --file server/Dockerfile --target plugins --tag photosync-ci-plugins:local .
          docker build --file server/Dockerfile --tag changhui/photosync:latest .
      - name: Build CPU ML image with verified bundled models
        if: matrix.component == 'machine-learning'
        run: |
          set -euo pipefail
          docker build --file machine-learning/Dockerfile --build-arg DEVICE=cpu --tag changhui/photosync-machine-learning:latest machine-learning
          docker run --rm --entrypoint python changhui/photosync-machine-learning:latest -m compileall -q immich_ml
          docker run --rm --entrypoint python changhui/photosync-machine-learning:latest -m immich_ml.model_cache verify --seed-root /opt/immich-model-seed --cache-root /opt/immich-model-seed --load
      - name: Container startup smoke test
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          if [[ "$COMPONENT" == server ]]; then
            image=changhui/photosync:latest
            docker run -d --name release-smoke -p 127.0.0.1:2295:2283 -e DB_BACKEND=sqlite -e SQLITE_PATH=/data/database/immich.sqlite -e REDIS_BACKEND=memory -e IMMICH_MACHINE_LEARNING_ENABLED=false -e CPU_CORES=2 "$image"
            path=/api/server/ping
          else
            image=changhui/photosync-machine-learning:latest
            docker run -d --name release-smoke -p 127.0.0.1:2295:3003 "$image"
            path=/ping
          fi
          ready=false
          for attempt in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:2295$path" >/dev/null; then ready=true; break; fi
            if [[ "$(docker inspect --format '{{.State.Running}}' release-smoke)" != true ]]; then break; fi
            sleep 5
          done
          docker logs --tail 50 release-smoke
          [[ "$ready" == true ]]
      - name: Push latest image and upload digest manifest
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMPONENT: ${{ matrix.component }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_TOKEN"
          printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin
          if [[ "$COMPONENT" == server ]]; then image=changhui/photosync:latest; else image=changhui/photosync-machine-learning:latest; fi
          docker push "$image"
          docker manifest inspect "$image" >/tmp/remote-manifest.json
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          jq -n --arg image "$image" --arg digest "$digest" --arg commit "$SOURCE_SHA" '{image:$image,digest:$digest,commit:$commit,platform:"linux/amd64"}' > "$COMPONENT-image.json"
          gh release upload "$TAG" "$COMPONENT-image.json" --clobber
      - name: Cleanup test container and registry session
        if: always()
        run: |
          docker rm -fv release-smoke 2>/dev/null || true
          docker logout || true
  publish:
    needs: [prepare, android, images]
    if: always() && inputs.verify_only != true && needs.prepare.result == 'success' && needs.android.result == 'success' && (needs.images.result == 'success' || ((inputs.component == 'android' || inputs.component == 'android-tests') && needs.images.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Verify all release assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir release-check
          cd release-check
          gh release download "$TAG" --pattern 'photosync-android-arm64-v8a-latest.apk' --pattern 'SHA256SUMS' --pattern '*-image.json'
          sha256sum --check SHA256SUMS
          jq -se --arg sha "$SOURCE_SHA" 'length==2 and all(.[]; .commit==$sha and (.digest | contains("@sha256:")))' server-image.json machine-learning-image.json >/dev/null
          cat > notes.md <<EOF
          Android arm64、服务端与 CPU ML 构建和验证均通过。

          - APK 日期版本：$BUILD_NUMBER（沿用现有签名）。
          - 服务端：\`changhui/photosync:latest\`。
          - ML：\`changhui/photosync-machine-learning:latest\`，包含并校验默认模型。
          - Docker 平台：linux/amd64；精确镜像摘要见附件 JSON。
          - 源码提交：$SOURCE_SHA。
          - SHA256SUMS 校验 APK；部署前请自行备份数据。本次发布不会替换现有 NAS 服务。
          EOF
          gh release edit "$TAG" --draft=false --latest --notes-file notes.md
