name: photosync-standalone

services:
  immich-server:
    container_name: immich_server
    image: changhui/photosync:${PHOTOSYNC_VERSION:?set PHOTOSYNC_VERSION to an immutable image tag}
    volumes:
      - ${UPLOAD_LOCATION:?set UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      DB_BACKEND: sqlite
      SQLITE_PATH: /data/database/immich.sqlite
      REDIS_BACKEND: memory
      IMMICH_MACHINE_LEARNING_ENABLED: 'false'
      CPU_CORES: '1'
      NODE_OPTIONS: --max-old-space-size=256
      MIMALLOC_PURGE_DELAY: '0'
      MIMALLOC_ARENA_RESERVE: '0'
    ports:
      - '${IMMICH_HTTP_PORT:-2283}:2283'
    restart: always
    healthcheck:
      disable: false
